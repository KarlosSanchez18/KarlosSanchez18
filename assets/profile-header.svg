  <line x1="1040" y1="110" x2="1360" y2="110" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="1095" y1="20" x2="1095" y2="330" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="1150" y1="20" x2="1150" y2="330" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(72,70)">
