<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Karlos Sanchez — Software Systems &amp; Automation</title>
  <desc id="desc">Dark editorial header for Karlos Sanchez's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset="0.72" stop-color="#111214"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="22" fill="url(#grid)"/>

  <path d="M1030 -20 L1400 -20 L1400 360 L1180 360 Z" fill="#ffffff" opacity="0.035"/>
  <path d="M1180 -20 L1400 -20 L1400 360 L1270 360 Z" fill="#ffffff" opacity="0.045"/>
  <path d="M1260 0 L1400 0 L1400 160 Z" fill="#ff6a00" opacity="0.16"/>
