<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Karlos Sanchez — Software Systems &amp; Automation</title>
  <desc id="desc">Dark editorial profile header in black, off-white and orange.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.62" stop-color="#0d0e10"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a00"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1400" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1400" height="420" fill="url(#bg)"/>
    <rect width="1400" height="420" fill="url(#grid)"/>

    <path d="M1110 -30 L1440 -30 L1440 450 L1265 450 Z" fill="#ffffff" opacity="0.028"/>
    <path d="M1260 -20 L1440 -20 L1440 210 Z" fill="#ff6a00" opacity="0.10"/>
    <path d="M1187 0V420M1234 0V420" stroke="#ffffff" stroke-opacity="0.045"/>

    <g transform="translate(70,95)">
      <path d="M0 0H36V92L112 0H158L91 80L164 166H116L65 107L36 141V166H0Z" fill="#f3efe9"/>
      <path d="M36 106L65 79V137L36 160Z" fill="url(#orange)"/>
    </g>

    <rect x="250" y="80" width="38" height="3" rx="1.5" fill="#ff6a00"/>
    <text x="250" y="117" fill="#9f9a94" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="4.6">SOFTWARE SYSTEMS &amp; AUTOMATION</text>
    <text x="246" y="202" fill="#f4f0e9" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" letter-spacing="-2">Karlos Sanchez</text>

    <text x="250" y="267" fill="#e5e0d9" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700">Systems that </text>
    <text x="445" y="267" fill="#ff6a00" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700">work.</text>
    <text x="250" y="307" fill="#88827c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" letter-spacing="0.8">From manual process to production-ready software.</text>

    <line x1="250" y1="345" x2="940" y2="345" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="250" cy="345" r="4" fill="#ff6a00"/>
    <text x="250" y="378" fill="#77716c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">BAURU, BRAZIL  /  REMOTE</text>

    <g transform="translate(1085,125)">
      <text x="0" y="0" fill="#f4f0e9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="5">BUILD</text>
      <text x="0" y="38" fill="#f4f0e9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="5">CONNECT</text>
      <text x="0" y="76" fill="#f4f0e9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="5">AUTOMATE</text>
      <rect x="0" y="101" width="44" height="3" rx="1.5" fill="#ff6a00"/>
      <text x="0" y="150" fill="#77716c" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="3">SYSTEMS</text>
      <text x="0" y="174" fill="#77716c" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="3">THAT WORK</text>
    </g>
  </g>

  <rect x="1" y="1" width="1398" height="418" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>