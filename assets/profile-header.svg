    <path d="M34 96 L61 72 L61 125 L34 145 Z" fill="#ff6a00"/>
  </g>

  <text x="260" y="108" fill="#f3efe8" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">Karlos Sanchez</text>
  <text x="264" y="151" fill="#c8c3bb" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="7">SOFTWARE SYSTEMS &amp; AUTOMATION</text>

  <line x1="264" y1="202" x2="320" y2="202" stroke="#ff6a00" stroke-width="4"/>
  <text x="350" y="216" fill="#f3efe8" font-family="Georgia, 'Times New Roman', serif" font-size="38">Systems that <tspan fill="#ff6a00" font-weight="700">work.</tspan></text>
  <text x="264" y="258" fill="#96928c" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2">FROM MANUAL PROCESS TO PRODUCTION-READY SOFTWARE</text>

  <text x="1085" y="235" fill="#f3efe8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="5">IDEAS</text>
  <text x="1085" y="265" fill="#f3efe8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="5">AUTOMATE</text>
  <text x="1085" y="295" fill="#f3efe8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="5">SCALE</text>
  <line x1="1085" y1="315" x2="1135" y2="315" stroke="#ff6a00" stroke-width="3"/>

  <rect x="1" y="1" width="1398" height="358" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
