<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Karlos Sanchez — Software for real operations</title>
  <desc id="desc">Animated dark editorial header for Karlos Sanchez.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.55" stop-color="#0c0d0f"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a00"/>
      <stop offset="1" stop-color="#ff8a32"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff6a00" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#ff6a00" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1400" height="420" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1400" height="420" fill="url(#bg)"/>
    <rect width="1400" height="420" fill="url(#grid)"/>

    <ellipse cx="1090" cy="175" rx="310" ry="240" fill="url(#glow)">
      <animate attributeName="cx" values="1040;1180;1040" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;210;150" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <path d="M1080 -30 L1440 -30 L1440 450 L1240 450 Z" fill="#ffffff" opacity="0.025"/>
    <path d="M1250 -20 L1440 -20 L1440 265 Z" fill="#ff6a00" opacity="0.11"/>
    <path d="M1185 0 V420" stroke="#ffffff" stroke-opacity="0.055"/>
    <path d="M1233 0 V420" stroke="#ffffff" stroke-opacity="0.035"/>

    <g transform="translate(66,88)">
      <path d="M0 0 H34 V88 L108 0 H151 L87 77 L156 158 H111 L63 102 L34 136 V158 H0 Z" fill="#f4f0e9"/>
      <path d="M34 101 L63 75 L63 132 L34 153 Z" fill="url(#orange)"/>
    </g>

    <text x="250" y="112" fill="#9c9892" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="4.5">SOFTWARE FOR REAL OPERATIONS</text>
    <text x="246" y="190" fill="#f4f0e9" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-2">Karlos Sanchez</text>

    <text x="250" y="248" fill="#d7d2cb" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">From messy workflows</text>
    <path d="M505 240 H575" stroke="#ff6a00" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9">
      <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M570 232 L582 240 L570 248" fill="none" stroke="#ff6a00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <text x="604" y="248" fill="#ff6a00" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">to working systems.</text>

    <text x="250" y="293" fill="#87827c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" letter-spacing="0.8">Automation · integrations · web/desktop · applied AI</text>

    <path d="M250 334 H940" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    <circle r="5" fill="#ff6a00">
      <animateMotion path="M250 334 H940" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <text x="250" y="365" fill="#6f6b66" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">BAURU, BRAZIL  /  REMOTE</text>

    <g transform="translate(1060,128)">
      <circle cx="92" cy="92" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
      <circle cx="92" cy="92" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
      <circle cx="92" cy="92" r="4" fill="#ff6a00">
        <animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>

      <text x="92" y="83" text-anchor="middle" fill="#f4f0e9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="3" opacity="1">BUILD
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;1" keyTimes="0;0.18;0.24;0.48;0.58;0.82;0.92;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="92" y="83" text-anchor="middle" fill="#f4f0e9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="3" opacity="0">CONNECT
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.18;0.24;0.43;0.49;0.76;0.82;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="92" y="83" text-anchor="middle" fill="#f4f0e9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="3" opacity="0">AUTOMATE
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.35;0.45;0.48;0.54;0.72;0.78;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="92" y="83" text-anchor="middle" fill="#ff6a00" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="3" opacity="0">SHIP
        <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.55;0.65;0.72;0.76;0.80;0.86;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="92" y="111" text-anchor="middle" fill="#77736e" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2.4">SYSTEMS THAT WORK</text>
    </g>

    <rect x="1340" y="40" width="8" height="22" rx="2" fill="#ff6a00">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1398" height="418" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>