    <g transform="translate(382,128)"><rect width="300" height="205" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.10"/><circle cx="48" cy="48" r="24" fill="#ff6a00" opacity="0.16"/><text x="48" y="57" text-anchor="middle" fill="#ff7a1f" font-size="28">↔</text><text x="30" y="104" fill="#f3efe8" font-size="25" font-weight="800">Integrations</text><text x="30" y="141" fill="#aaa59f" font-size="17">APIs, webhooks, payments,</text><text x="30" y="166" fill="#aaa59f" font-size="17">WhatsApp and services.</text></g>
    <g transform="translate(710,128)"><rect width="300" height="205" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.10"/><circle cx="48" cy="48" r="24" fill="#ff6a00" opacity="0.16"/><text x="48" y="57" text-anchor="middle" fill="#ff7a1f" font-size="28">▦</text><text x="30" y="104" fill="#f3efe8" font-size="25" font-weight="800">Business Systems</text><text x="30" y="141" fill="#aaa59f" font-size="17">SaaS, internal tools, CRMs</text><text x="30" y="166" fill="#aaa59f" font-size="17">and operational products.</text></g>
    <g transform="translate(1038,128)"><rect width="300" height="205" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.10"/><circle cx="48" cy="48" r="24" fill="#ff6a00" opacity="0.16"/><text x="48" y="57" text-anchor="middle" fill="#ff7a1f" font-size="28">✦</text><text x="30" y="104" fill="#f3efe8" font-size="25" font-weight="800">Applied AI</text><text x="30" y="141" fill="#aaa59f" font-size="17">Voice agents, qualification</text><text x="30" y="166" fill="#aaa59f" font-size="17">and AI-assisted workflows.</text></g>
